name: Compilar EXE con Nuitka

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install nuitka

    - name: Preparar script de entrada
      run: |
        copy src\pruebaspy\__init__.py main.py

    - name: Generar ejecutable con Nuitka
      run: |
        python -m nuitka --standalone --onefile --windows-console-mode=force --assume-yes-for-downloads --output-filename=map_dmc.exe main.py

    - name: Crear certificado autofirmado y firmar ejecutable
      shell: pwsh
      run: |
        # 1. Crear un certificado autofirmado temporal
        $cert = New-SelfSignedCertificate -DnsName "map_dmc.local" -CertStoreLocation "Cert:\CurrentUser\My" -Type CodeSigningCert
        
        # 2. Exportarlo a un archivo PFX temporal
        $password = ConvertTo-SecureString -String "Password123" -Force -AsPlainText
        Export-PfxCertificate -Cert $cert -FilePath "$env:TEMP\temp_cert.pfx" -Password $password
        
        # 3. Encontrar signtool.exe en el runner de Windows
        $signtool = Get-ChildItem -Path "C:\Program Files*\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" | Select-Object -ExpandProperty FullName | Select-Object -Last 1
        
        # 4. Firmar el ejecutable generado por Nuitka
        & $signtool sign /f "$env:TEMP\temp_cert.pfx" /p "Password123" /fd SHA256 map_dmc.exe
        
        Write-Host "¡Ejecutable firmado correctamente!"

    - name: Limpiar certificado temporal
      if: always()
      shell: pwsh
      run: Remove-Item -Path "$env:TEMP\temp_cert.pfx" -ErrorAction SilentlyContinue

    - name: Actualizar Release Automático
      uses: softprops/action-gh-release@v2
      with:
        files: map_dmc.exe
        tag_name: latest
        name: Versión de Desarrollo
        body: "Actualizado automáticamente con cada cambio en el código y firmado digitalmente."
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}