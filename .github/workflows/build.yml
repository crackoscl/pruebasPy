name: Compilar EXE con Nuitka

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Instalar uv y Nuitka
      run: |
        python -m pip install --upgrade pip
        pip install nuitka uv

    - name: Preparar script de entrada
      run: |
        copy src\pruebaspy\__init__.py main.py

    - name: Generar ejecutable con Nuitka
      run: |
        python -m nuitka --standalone --onefile --windows-console-mode=force --output-filename=map_dmc.exe main.py

    - name: Guardar el ejecutable (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: dmc-loader-exe
        path: map_dmc.exe