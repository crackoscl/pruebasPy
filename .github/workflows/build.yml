name: Compilar EXE para Windows con uv

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Instalar uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Configurar Python
      run: uv python install 3.10

    - name: Instalar PyInstaller usando uv
      run: |
        uv pip install --system pyinstaller

    - name: Generar ejecutable
      # Apuntamos directamente al __init__.py que creó uv
      run: |
        pyinstaller --onefile --name map_dmc src/pruebaspy/__init__.py

    - name: Guardar el ejecutable (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: dmc-loader-exe
        path: dist/*.exe